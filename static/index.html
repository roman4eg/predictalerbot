<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predict.fun — Фармінг Бот</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --border: #dcdde1;
    --accent: #6c5ce7; --green: #00b894; --red: #d63031;
    --text: #2d3436; --muted: #636e72;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    padding: 20px; max-width: 900px; margin: 0 auto;
  }
  h1 { font-size: 1.4em; margin-bottom: 20px; color: var(--accent); }
  h2 { font-size: 1.1em; margin-bottom: 12px; color: var(--muted); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  label { display: block; font-size: 0.85em; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  input, select {
    width: 100%; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    background: #fff; color: var(--text); font-size: 0.95em;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  button {
    padding: 10px 18px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 0.9em; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-danger { background: var(--red); color: #fff; font-size: 0.8em; padding: 6px 12px; }
  .btn-danger:hover { opacity: 0.85; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-small { padding: 6px 12px; font-size: 0.8em; }
  #outcome-selector { margin-top: 10px; }
  .outcomes-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .outcome-btn {
    padding: 8px 16px; border: 2px solid var(--border);
    border-radius: 6px; background: transparent; color: var(--text); cursor: pointer;
  }
  .outcome-btn.selected { border-color: var(--accent); background: rgba(108,92,231,0.1); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
  th { text-align: left; padding: 8px 6px; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 500; }
  td { padding: 8px 6px; border-bottom: 1px solid var(--border); }
  .price { font-family: monospace; }
  .error-text { color: var(--red); font-size: 0.8em; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75em; font-weight: 600; }
  .badge-green { background: rgba(0,184,148,0.15); color: var(--green); }
  .badge-red { background: rgba(214,48,49,0.15); color: var(--red); }
  .badge-grey { background: rgba(99,110,114,0.15); color: var(--muted); }
  #market-info { margin-top: 10px; font-weight: 600; }
  .balance-info { margin-top: 8px; font-size: 0.85em; color: var(--muted); }
  .balance-info strong { color: var(--text); }
  .shares-row { display: flex; gap: 8px; align-items: flex-end; }
  .shares-row input { flex: 1; }
  .shares-row button { flex: 0 0 auto; margin-bottom: 0; }
</style>
</head>
<body>

<h1>Predict.fun — Фармінг Бот</h1>

<div class="card">
  <h2>Нова сесія</h2>
  <label>Посилання на подію</label>
  <div class="row">
    <input type="text" id="market-url" placeholder="https://predict.fun/market/...">
    <button class="btn-secondary" id="btn-load" style="flex:0 0 auto; width:160px;">Завантажити</button>
  </div>
  <div id="market-info"></div>
  <div id="outcome-selector" style="display:none;">
    <label>Результат</label>
    <div class="outcomes-row" id="outcomes-row"></div>
  </div>

  <div class="row" style="margin-top:10px;">
    <div>
      <label>Сторона</label>
      <select id="side">
        <option value="0">КУПИТИ</option>
        <option value="1">ПРОДАТИ</option>
      </select>
    </div>
    <div>
      <label>Шейрсів</label>
      <div class="shares-row">
        <input type="number" id="shares" value="200" min="1">
        <button class="btn-secondary btn-small" id="btn-max">MAX</button>
      </div>
      <div class="balance-info" id="balance-info"></div>
    </div>
  </div>

  <div class="row">
    <div>
      <label>Глибина (центів від топ біду)</label>
      <input type="number" id="depth" value="1" min="1" max="50">
    </div>
    <div>
      <label>Макс. спред (центи)</label>
      <input type="number" id="max-spread" value="3" min="1" max="50">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Зупинити о (UTC)</label>
      <input type="datetime-local" id="stop-at">
    </div>
    <div style="flex:0 0 auto; display:flex; align-items:flex-end;">
    </div>
  </div>

  <div style="margin-top:16px;">
    <button class="btn-primary" id="btn-start">Почати фармінг</button>
  </div>
</div>

<div class="card">
  <h2>Активні сесії</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Подія / Результат</th>
        <th>Сторона</th>
        <th>Ордер (ц)</th>
        <th>Бід / Аск</th>
        <th>Статус</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="sessions-body">
      <tr><td colspan="7" style="text-align:center;color:var(--muted);">Немає активних сесій</td></tr>
    </tbody>
  </table>
</div>

<script>
var selectedOutcome = null;
var marketData = null;
var currentBalance = null;

document.getElementById("btn-load").addEventListener("click", resolveMarket);
document.getElementById("btn-start").addEventListener("click", createSession);
document.getElementById("btn-max").addEventListener("click", setMaxShares);

fetchBalance();

async function fetchBalance() {
  try {
    var resp = await fetch("/api/balance");
    var data = await resp.json();
    if (data.balance !== undefined) {
      currentBalance = data.balance;
      document.getElementById("balance-info").innerHTML =
        "Баланс: <strong>" + currentBalance.toFixed(2) + " USDT</strong>";
    }
  } catch(e) { console.error("balance fetch error:", e); }
}

function setMaxShares() {
  if (currentBalance === null) { alert("Баланс ще не завантажено"); return; }
  if (!selectedOutcome) { alert("Спочатку оберіть результат"); return; }
  var depthCents = parseInt(document.getElementById("depth").value) || 1;
  var topBid = 50;
  var priceCents = topBid - depthCents;
  if (priceCents <= 0) priceCents = 1;
  var priceUsd = priceCents / 100;
  var maxShares = Math.floor(currentBalance / priceUsd);
  if (maxShares < 1) maxShares = 1;
  document.getElementById("shares").value = maxShares;
  document.getElementById("balance-info").innerHTML =
    "Баланс: <strong>" + currentBalance.toFixed(2) + " USDT</strong>" +
    " | Макс шейрсів за ~" + priceCents + "ц: <strong>" + maxShares + "</strong>";
}

async function resolveMarket() {
  var url = document.getElementById("market-url").value.trim();
  if (!url) return;
  var info = document.getElementById("market-info");
  info.textContent = "Завантаження...";
  try {
    var resp = await fetch("/api/resolve-market?url=" + encodeURIComponent(url));
    var data = await resp.json();
    if (data.error) { info.textContent = "Помилка: " + data.error; return; }
    marketData = data;
    info.textContent = data.title;
    var row = document.getElementById("outcomes-row");
    row.innerHTML = "";
    selectedOutcome = null;
    data.outcomes.forEach(function(o, i) {
      var btn = document.createElement("button");
      btn.className = "outcome-btn";
      btn.textContent = o.name;
      btn.addEventListener("click", function() { selectOutcome(i); });
      row.appendChild(btn);
    });
    document.getElementById("outcome-selector").style.display = "block";
    fetchBalance();
  } catch(e) { info.textContent = "Помилка: " + e.message; }
}

function selectOutcome(idx) {
  selectedOutcome = marketData.outcomes[idx];
  var buttons = document.querySelectorAll(".outcome-btn");
  for (var i = 0; i < buttons.length; i++) {
    if (i === idx) { buttons[i].classList.add("selected"); }
    else { buttons[i].classList.remove("selected"); }
  }
}

async function createSession() {
  if (!selectedOutcome) { alert("Спочатку оберіть результат"); return; }
  var stopAtInput = document.getElementById("stop-at").value;
  var payload = {
    market_id: selectedOutcome.market_id,
    market_title: marketData.title,
    token_id: selectedOutcome.on_chain_id,
    outcome_name: selectedOutcome.name,
    side: parseInt(document.getElementById("side").value),
    shares: parseFloat(document.getElementById("shares").value),
    max_spread_cents: parseInt(document.getElementById("max-spread").value),
    depth_cents: parseInt(document.getElementById("depth").value),
    stop_at: stopAtInput ? stopAtInput + ":00" : null,
    is_neg_risk: selectedOutcome.is_neg_risk,
    is_yield_bearing: selectedOutcome.is_yield_bearing,
    fee_rate_bps: selectedOutcome.fee_rate_bps
  };
  try {
    var resp = await fetch("/api/sessions", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    var data = await resp.json();
    if (data.error) { alert("Помилка: " + data.error); return; }
    refreshSessions();
  } catch(e) { alert("Помилка: " + e.message); }
}

async function stopSession(id) {
  if (!confirm("Зупинити сесію " + id + "?")) return;
  await fetch("/api/sessions/" + id, { method: "DELETE" });
  refreshSessions();
}

async function refreshSessions() {
  try {
    var resp = await fetch("/api/sessions");
    var data = await resp.json();
    var tbody = document.getElementById("sessions-body");
    if (!data.sessions || !data.sessions.length) {
      tbody.innerHTML = "<tr><td colspan=\"7\" style=\"text-align:center;color:var(--muted);\">Немає активних сесій</td></tr>";
      return;
    }
    var html = "";
    for (var i = 0; i < data.sessions.length; i++) {
      var s = data.sessions[i];
      var statusText = "Зупинено";
      var badge = "badge-grey";
      if (s.active && !s.is_expired) { statusText = "Активна"; badge = "badge-green"; }
      else if (s.is_expired) { statusText = "Дедлайн"; badge = "badge-red"; }
      var errHtml = s.error ? "<br><span class=\"error-text\">" + s.error + "</span>" : "";
      var orderPrice = s.current_order_price_cents !== null ? s.current_order_price_cents + "ц" : "\u2014";
      var bidAsk = (s.last_top_bid !== null ? s.last_top_bid : "\u2014") + " / " + (s.last_top_ask !== null ? s.last_top_ask : "\u2014");
      var stopBtn = s.active ? "<button class=\"btn-danger\" data-stop=\"" + s.session_id + "\">Зупинити</button>" : "";
      html += "<tr>";
      html += "<td>" + s.session_id + "</td>";
      html += "<td>" + s.market_title + "<br><strong>" + s.outcome_name + "</strong></td>";
      html += "<td>" + s.side + "</td>";
      html += "<td class=\"price\">" + orderPrice + "</td>";
      html += "<td class=\"price\">" + bidAsk + "</td>";
      html += "<td><span class=\"badge " + badge + "\">" + statusText + "</span>" + errHtml + "</td>";
      html += "<td>" + stopBtn + "</td>";
      html += "</tr>";
    }
    tbody.innerHTML = html;
    var stopBtns = tbody.querySelectorAll("[data-stop]");
    for (var j = 0; j < stopBtns.length; j++) {
      stopBtns[j].addEventListener("click", function() {
        stopSession(this.getAttribute("data-stop"));
      });
    }
  } catch(e) { console.error(e); }
}

setInterval(refreshSessions, 3000);
refreshSessions();
</script>

</body>
</html>
